[package]
name = "ensign-bench-clap"
version = "0.0.0"
edition = "2021"
publish = false

# The rival of ensign's bench/parse.zig: the same declarations and command
# lines through clap. Run by hand: `cargo run --release` (see ../README).
[dependencies]
clap = { version = "=4.6.7", features = ["string"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "=0.3.3"

[profile.release]
lto = true
codegen-units = 1
